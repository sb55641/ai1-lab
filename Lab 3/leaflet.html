<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puzzle</title>
<link rel="stylesheet" href="leaflet-1.7.1/leaflet.css" />
<link rel="stylesheet" href="style_1.css" />
<script src="leaflet-1.7.1/leaflet-src.js"></script>
<script src="leaflet-1.7.1/leaflet-providers.js"></script>
<script src="leaflet-1.7.1/leaflet-image.js"></script>

</head>
<body>  

<h2>Puzzle</h2>

<div id="map"></div>
<button id="getLocation">Moja lokalizacja</button>
<button id="saveRaster">Pobierz mape</button>
<button id="createPuzzle" disabled>Stworz puzzle</button>

<br>
<canvas id="rasterMap" width="300" height="300" style="display:none;"></canvas>
<canvas id="savedRasterPreview" width="300" height="300"></canvas>

<div class="grid-wrapper">
    <div>
        
        <div id="gridSource" class="grid"></div>
    </div>
    <div>
        
        <div id="gridTarget" class="grid">
            <!-- 16 slots -->
            <div class="puzzle-slot" data-pos="0-0"></div>
            <div class="puzzle-slot" data-pos="0-1"></div>
            <div class="puzzle-slot" data-pos="0-2"></div>
            <div class="puzzle-slot" data-pos="0-3"></div>
            <div class="puzzle-slot" data-pos="1-0"></div>
            <div class="puzzle-slot" data-pos="1-1"></div>
            <div class="puzzle-slot" data-pos="1-2"></div>
            <div class="puzzle-slot" data-pos="1-3"></div>
            <div class="puzzle-slot" data-pos="2-0"></div>
            <div class="puzzle-slot" data-pos="2-1"></div>
            <div class="puzzle-slot" data-pos="2-2"></div>
            <div class="puzzle-slot" data-pos="2-3"></div>
            <div class="puzzle-slot" data-pos="3-0"></div>
            <div class="puzzle-slot" data-pos="3-1"></div>
            <div class="puzzle-slot" data-pos="3-2"></div>
            <div class="puzzle-slot" data-pos="3-3"></div>
        </div>
    </div>
</div>
<script src="skrypt.js"></script>
</body>
</html>
